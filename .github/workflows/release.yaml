name: release
on:
  # Every push to main runs the tests once, here. test.yaml has no push trigger of its own.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The action skips a version that is already published, so an unchanged version succeeds.
      - uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.4
        with:
          devcontainer-cli-version: "0.88.0"
          publish-features: "true"
          base-path-to-features: ./src
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
