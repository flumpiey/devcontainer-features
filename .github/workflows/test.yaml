name: test
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install shfmt /usr/local/bin/shfmt
      - name: Run all checks
        run: bash scripts/verify.sh ci
      - name: Validate the Feature
        if: github.event_name == 'pull_request'
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.4
        with:
          devcontainer-cli-version: "0.88.0"
          validate-only: "true"
          base-path-to-features: ./src
